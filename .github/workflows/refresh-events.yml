name: Refresh events

on:
  workflow_dispatch:
  schedule:
    - cron: "17 * * * *"

jobs:
  refresh-events:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Create local environment file
        run: |
          cat > .env.local << 'EOF'
          VITE_SUPABASE_URL=${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY=${{ secrets.VITE_SUPABASE_ANON_KEY }}
          SUPABASE_URL=${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY=${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          TICKETMASTER_API_KEY=${{ secrets.TICKETMASTER_API_KEY }}
          EOF

      - name: Import Ticketmaster raw events
        run: npm run import:ticketmaster

      - name: Normalize Ticketmaster raw events
        run: npm run normalize:ticketmaster

      - name: Import UBC raw events
        run: npm run import:ubc

      - name: Normalize UBC raw events
        run: npm run normalize:ubc

      - name: Import Blueprint raw events
        run: npm run import:blueprint

      - name: Normalize Blueprint raw events
        run: npm run normalize:blueprint

      - name: Cleanup expired events
        run: npm run cleanup:events
